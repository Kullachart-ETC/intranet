<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระเบียบบริษัท - EARTH (THAILAND)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Sarabun',sans-serif;background:#F5F5F3;color:#1a1a18}
.nav{background:#1a1a18;padding:0 24px;display:flex;align-items:center;gap:16px;height:52px;position:sticky;top:0;z-index:50}
.nav-logo{color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-logo img{height:32px;width:32px;object-fit:contain}
.nav-links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav-links a{color:#aaa;font-size:13px;padding:6px 10px;border-radius:6px;text-decoration:none;transition:.15s}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,.1)}
a.nav-home{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#fff;color:#1D9E75;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.15s}
a.nav-home:hover{background:#1D9E75;color:#fff;transform:scale(1.08)}

.nav-right{display:flex;align-items:center;gap:8px}
.nav-toggle{display:none;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px 8px;border-radius:6px}
.nav-toggle:hover{background:rgba(255,255,255,.1)}
.search-box{display:flex;align-items:center;background:rgba(255,255,255,.1);border-radius:20px;padding:2px 4px 2px 10px}
.search-box input{background:none;border:none;color:#fff;font-size:12px;font-family:inherit;width:110px;outline:none}
.search-box input::placeholder{color:#888}
.search-box button{background:none;border:none;color:#aaa;cursor:pointer;font-size:14px;padding:4px 6px}
@media (max-width:760px){.nav{padding:0 12px}.nav-toggle{display:inline-flex;align-items:center;justify-content:center}.nav-links{display:none;position:absolute;top:52px;left:0;right:0;background:#1a1a18;flex-direction:column;align-items:flex-start;gap:2px;padding:10px;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:60}.nav-links.open{display:flex}.nav-links a:not(.nav-home){padding:10px 14px;width:100%}.nav-links .nav-home{margin-bottom:6px}.nav-user{display:none}}
.nav-user{color:#ccc;font-size:12px}
.btn-logout{font-size:12px;color:#aaa;background:none;border:1px solid #444;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}
.page{max-width:900px;margin:0 auto;padding:32px 16px}
h1{font-size:22px;font-weight:700}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:7px 16px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px;font-family:inherit;transition:.15s}
.tab:hover{border-color:#1D9E75;color:#1D9E75}
.tab.active{background:#1D9E75;border-color:#1D9E75;color:#fff;font-weight:600}
.empty{text-align:center;color:#aaa;padding:48px;font-size:14px}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:.15s}
.btn-primary{background:#1D9E75;color:#fff}
.btn-primary:hover{background:#178a63}
.btn-primary:disabled{background:#9acfbd;cursor:not-allowed}
.btn-outline{background:#fff;border:1px solid #ddd;color:#444}
.btn-danger{background:#fff;border:1px solid #f5c6c6;color:#dc2626;font-size:12px;padding:4px 10px}
.btn-danger:hover{background:#fef2f2}
.upload-area{border:2px dashed #1D9E75;border-radius:12px;padding:16px;margin-bottom:20px;display:none;background:#fff}
.upload-area.show{display:block}
.upload-row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:640px){.upload-row{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:12px;color:#666}
.form-group select,.form-group input[type="file"]{border:1px solid #ddd;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px;display:none}
.alert.show{display:block}
.alert-ok{background:#e8f5f0;color:#1D9E75}
.alert-err{background:#fef2f2;color:#dc2626}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.view-modal{background:#fff;border-radius:12px;padding:18px;width:100%;max-width:920px;max-height:92vh;overflow-y:auto;position:relative}
.view-modal h3{margin-bottom:14px;padding-right:34px;font-size:15px}
.mclose{position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:#888;width:30px;height:30px;border-radius:6px}
.mclose:hover{background:#f5f5f3}
.flip-loading{text-align:center;padding:60px 20px;color:#888;font-size:13px}
#flipBookContainer{margin:0 auto}
#flipBookContainer canvas,#flipBookContainer img{box-shadow:0 2px 10px rgba(0,0,0,.15)}
</style>
</head>
<body>
<nav class="nav">
  <a href="/index.html" class="nav-logo"><img src="/logo.png" onerror="this.style.display='none'"> EARTH (THAILAND)</a>
  <div class="nav-links" id="navLinks">
    <a href="/index.html" class="nav-home" title="หน้าหลัก"><i class="ti ti-home"></i></a>
    <a href="/about.html" data-i18n="nav.about">เกี่ยวกับเรา</a>
    <a href="/org-chart.html" data-i18n="nav.orgchart">โครงสร้างองค์กร</a>
    <a href="/news.html" data-i18n="nav.news">ข่าวสารกิจกรรม</a>
    <a href="/webboard.html" data-i18n="nav.webboard">เว็บบอร์ด</a>
    <a href="/regulations.html" class="active" data-i18n="nav.regulations">ระเบียบบริษัท</a>
    <a href="/media-center.html">Media Center</a>
    <a href="/forms.html" data-i18n="nav.forms">แบบฟอร์ม - ARS</a>
    <a href="/calendar.html">ปฏิทินกิจกรรม</a>
    <a href="/knowledge-base.html">Knowledge Base</a>
    <a href="/csr.html">CSR</a>
  </div>
  <div class="nav-right"><div class="search-box"><input id="navSearch" placeholder="ค้นหา..." onkeydown="if(event.key==='Enter'&&this.value.trim())location.href='/search.html?q='+encodeURIComponent(this.value.trim())"><button onclick="const v=document.getElementById('navSearch').value.trim();if(v)location.href='/search.html?q='+encodeURIComponent(v)"><i class="ti ti-search"></i></button></div><span class="nav-user" id="nav-user"></span><button id="lang-toggle" class="btn-logout" onclick="toggleLang()">EN</button><button class="btn-logout" data-i18n="nav.logout" onclick="logout()">ออกจากระบบ</button></div>
  <button class="nav-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')" aria-label="เมนู"><i class="ti ti-menu-2"></i></button>
</nav>
<div class="page">
  <div class="page-head">
    <h1>📜 ระเบียบบริษัท</h1>
    <button class="btn btn-primary" id="btn-upload-toggle" style="display:none" onclick="toggleUpload()">+ เพิ่มเอกสาร</button>
  </div>

  <div id="upload-area" class="upload-area">
    <div id="alert" class="alert"></div>
    <div class="upload-row">
      <div class="form-group">
        <label>ชื่อเอกสาร</label>
        <input type="text" id="up-title" placeholder="เช่น ระเบียบการลาหยุด 2569">
      </div>
      <div class="form-group">
        <label>หมวดหมู่</label>
        <select id="up-dept">
          <option value="ระเบียบ">ระเบียบ</option>
          <option value="นโยบาย">นโยบาย</option>
          <option value="ประกาศ">ประกาศ</option>
        </select>
      </div>
      <div class="form-group">
        <label>ไฟล์</label>
        <input type="file" id="up-file" accept="*/*">
      </div>
      <button class="btn btn-primary" id="btn-do-upload" onclick="doUpload()">อัปโหลด</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="filterDept('ระเบียบ',this)">ระเบียบ</button>
    <button class="tab" onclick="filterDept('นโยบาย',this)">นโยบาย</button>
    <button class="tab" onclick="filterDept('ประกาศ',this)">ประกาศ</button>
    <button class="tab" onclick="filterDept('all',this)">ทั้งหมด</button>
  </div>
  <div id="doc-list"><div class="empty">กำลังโหลด...</div></div>
</div>

<div class="overlay" id="viewOverlay" onclick="if(event.target===this)closeView()">
  <div class="view-modal">
    <button class="mclose" onclick="closeView()">✕</button>
    <h3 id="viewTitle"></h3>
    <div class="flip-loading" id="flipLoading">กำลังโหลดเอกสาร...</div>
    <div id="flipBookContainer" style="display:none"></div>
  </div>
</div>
<script>
let allDocs=[];
let canManage=false;
let pageFlip=null;
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function viewDoc(id, title) {
  document.getElementById('viewTitle').textContent = title;
  document.getElementById('flipLoading').style.display = '';
  document.getElementById('flipLoading').textContent = 'กำลังโหลดเอกสาร...';
  document.getElementById('flipBookContainer').style.display = 'none';
  document.getElementById('flipBookContainer').innerHTML = '';
  document.getElementById('viewOverlay').classList.add('open');
  try {
    const buf = await fetch('/api/documents/'+id+'/download').then(r=>{
      if(!r.ok) throw new Error('โหลดไฟล์ไม่สำเร็จ');
      return r.arrayBuffer();
    });
    const pdf = await pdfjsLib.getDocument({data: buf}).promise;
    const images = [];
    const baseViewport = (await pdf.getPage(1)).getViewport({scale: 1});
    const pageW = Math.round(baseViewport.width);
    const pageH = Math.round(baseViewport.height);
    const renderScale = 2.5;
    for (let i=1; i<=pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({scale: renderScale});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width; canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      images.push(canvas.toDataURL('image/png'));
    }
    const container = document.getElementById('flipBookContainer');
    document.getElementById('flipLoading').style.display = 'none';
    container.style.display = '';
    if (pageFlip) { try { pageFlip.destroy(); } catch(e){} pageFlip = null; }
    // page-flip draws pages onto its own internal <canvas> sized in CSS
    // pixels with no devicePixelRatio awareness, so on a HiDPI/retina screen
    // its canvas is genuinely lower-res than the physical screen no matter
    // how sharp the source image is. Work around it the same way manual
    // canvas HiDPI fixes do: ask it to render dpr× larger than the visual
    // target, then shrink the whole thing back down with CSS zoom (which,
    // unlike transform, keeps layout and pointer coordinates correct).
    const dpr = window.devicePixelRatio || 1;
    container.style.zoom = 1 / dpr;
    pageFlip = new St.PageFlip(container, {
      width: pageW * dpr, height: pageH * dpr,
      size: 'stretch',
      minWidth: 280 * dpr, maxWidth: 900 * dpr,
      minHeight: 360 * dpr, maxHeight: 1200 * dpr,
      showCover: false,
      maxShadowOpacity: 0.5
    });
    pageFlip.loadFromImages(images);
  } catch(e) {
    document.getElementById('flipLoading').textContent = 'ไม่สามารถแสดงเอกสารได้: ' + e.message;
  }
}
function closeView() {
  document.getElementById('viewOverlay').classList.remove('open');
  if (pageFlip) { try { pageFlip.destroy(); } catch(e){} pageFlip = null; }
}

async function api(path, method='GET', body=null) {
  const opts = { method, headers:{} };
  if (body instanceof FormData) opts.body = body;
  else if (body) { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(body); }
  const r = await fetch('/api'+path, opts);
  if (!r.ok) { const e = await r.json().catch(()=>({error:r.statusText})); throw new Error(e.error||r.statusText); }
  return r.json();
}

function escHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtSize(b){if(!b)return'';if(b<1024)return b+'B';if(b<1048576)return(b/1024).toFixed(1)+'KB';return(b/1048576).toFixed(1)+'MB';}
function fmtDate(dt){if(!dt)return'';return new Date(dt).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});}
function fileIcon(m=''){if(m.includes('pdf'))return'📄';if(m.includes('word')||m.includes('doc'))return'📝';if(m.includes('sheet'))return'📊';if(m.includes('image'))return'🖼️';return'📎';}

function filterDept(dept,btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const docs=dept==='all'?allDocs:allDocs.filter(d=>d.dept===dept);
  render(docs);
}

function render(docs){
  const el=document.getElementById('doc-list');
  if(!docs.length){el.innerHTML='<div class="empty">ไม่พบเอกสาร</div>';return;}
  el.innerHTML=`<div style="background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)">
    <div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:#f8f8f6"><th style="padding:10px 14px;text-align:left;color:#555">ชื่อเอกสาร</th><th style="padding:10px 14px;text-align:left;color:#555">หมวด</th><th style="padding:10px 14px;text-align:left;color:#555">ขนาด</th><th style="padding:10px 14px;text-align:left;color:#555">วันที่</th><th style="padding:10px 14px"></th></tr></thead>
      <tbody>${docs.map(d=>`<tr style="border-top:1px solid #f0f0ec">
        <td style="padding:10px 14px"><span style="margin-right:6px">${fileIcon(d.mime_type)}</span><strong>${escHtml(d.title || d.original_name)}</strong></td>
        <td style="padding:10px 14px;color:#888">${escHtml(d.dept)}</td>
        <td style="padding:10px 14px;color:#888">${fmtSize(d.file_size)}</td>
        <td style="padding:10px 14px;color:#888;white-space:nowrap">${fmtDate(d.created_at)}</td>
        <td style="padding:10px 14px;white-space:nowrap;text-align:right">
          ${d.dept==='ประกาศ'&&d.mime_type==='application/pdf'?`<button onclick="viewDoc(${d.id},'${escHtml(d.title||d.original_name)}')" style="background:none;border:none;color:#1D9E75;font-size:12px;cursor:pointer;font-family:inherit;padding:0;margin-right:10px">👁 ดู</button>`:''}
          <a href="/api/documents/${d.id}/download" style="color:#1D9E75;font-size:12px;text-decoration:none">⬇ ดาวน์โหลด</a>
          ${canManage?`<button class="btn btn-danger" style="margin-left:8px" onclick="delDoc(${d.id},'${escHtml(d.title || d.original_name)}')">✕ ลบ</button>`:''}
        </td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
}

function toggleUpload(){ document.getElementById('upload-area').classList.toggle('show'); }
function showAlert(msg,type='ok'){
  const el=document.getElementById('alert');
  el.textContent=msg; el.className=`alert show alert-${type}`;
  setTimeout(()=>el.classList.remove('show'),4000);
}

async function doUpload(){
  const title=document.getElementById('up-title').value.trim();
  const dept=document.getElementById('up-dept').value;
  const file=document.getElementById('up-file').files[0];
  if(!file){showAlert('กรุณาเลือกไฟล์','err');return;}
  const btn=document.getElementById('btn-do-upload');
  btn.disabled=true; btn.textContent='กำลังอัปโหลด...';
  try{
    const fd=new FormData();
    fd.append('file',file);
    fd.append('dept',dept);
    fd.append('title',title);
    await api('/documents','POST',fd);
    showAlert('อัปโหลดสำเร็จ','ok');
    document.getElementById('up-title').value='';
    document.getElementById('up-file').value='';
    await loadDocs();
  }catch(e){ showAlert(e.message,'err'); }
  btn.disabled=false; btn.textContent='อัปโหลด';
}

async function delDoc(id,name){
  if(!confirm(`ต้องการลบ "${name}" ใช่ไหมครับ?`))return;
  try{
    await api('/documents/'+id,'DELETE');
    await loadDocs();
  }catch(e){ alert('ลบไม่สำเร็จ: '+e.message); }
}

async function loadDocs(){
  allDocs=await api('/documents').catch(()=>[]);
  const regDepts=['ระเบียบ','นโยบาย','ประกาศ'];
  const regDocs=allDocs.filter(d=>regDepts.includes(d.dept));
  if(regDocs.length)allDocs=regDocs;
  const activeTab=document.querySelector('.tab.active');
  const activeDept=activeTab?(activeTab.textContent.trim()==='ทั้งหมด'?'all':activeTab.textContent.trim()):'ระเบียบ';
  render(activeDept==='all'?allDocs:allDocs.filter(d=>d.dept===activeDept));
}

async function logout(){await fetch('/api/logout',{method:'POST'});window.location.href='/login.html';}
(async()=>{
  try{
    const me=await fetch('/api/me').then(r=>r.json());
    if(me.error){window.location.href='/login.html';return;}
    document.getElementById('nav-user').textContent=me.name;

    const r=await fetch('/api/documents/can-manage');
    if(r.ok){ const d=await r.json(); canManage=d.canManage; }
    if(canManage) document.getElementById('btn-upload-toggle').style.display='';

    await loadDocs();
  }catch(e){window.location.href='/login.html';}
})();
</script>
<script src="/i18n.js"></script>
</body></html>
