<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — EARTH (THAILAND)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans Thai', Inter, system-ui, sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(160deg, #EEF3FB 0%, #DCE6F5 100%);
  position:relative;
}
.card{
  position:relative;
  z-index:1;
  background:linear-gradient(165deg, #ffffff 0%, #fafbfe 100%);
  border:1px solid #E4EAF3;
  border-radius:14px;
  padding:32px 40px 28px;
  width:400px;
  max-width:95vw;
  box-shadow:0 6px 20px rgba(20,40,80,0.10);
}
@media (max-width:480px){
  .card{padding:24px 24px 20px}
}

/* โลโก้: fade-in ครั้งเดียวตอนโหลด (~500ms) แล้วนิ่งสนิท ไม่มี loop */
.logo-wrap{text-align:center;margin-bottom:28px;animation:logoFadeIn .5s ease-out both}
.globe-wrap{position:relative;display:inline-block;width:80px;height:80px;margin-bottom:8px;perspective:400px;animation:globeShadowFade .5s ease-out .2s both}
.globe-glow{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(26,95,168,.20) 0%,rgba(26,95,168,0) 70%);filter:blur(6px);z-index:0}
.globe-clip{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;z-index:1;animation:globeRotate 1.8s ease-out .3s both}
.globe-img{width:100%;height:100%;object-fit:contain}
.globe-shine-sweep{position:absolute;top:0;left:0;width:26px;height:100%;background:linear-gradient(75deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%);pointer-events:none;transform:translateX(-60px) skewX(-18deg);animation:globeShineSweep .5s ease-out 2.1s both}
.earth-text-img{width:122px;height:auto;display:block;margin:0 auto}

@keyframes logoFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes globeShadowFade{from{filter:drop-shadow(0 4px 8px rgba(15,44,111,0))}to{filter:drop-shadow(0 4px 8px rgba(15,44,111,.16))}}
@keyframes globeRotate{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@keyframes globeShineSweep{0%{transform:translateX(-60px) skewX(-18deg)}100%{transform:translateX(140px) skewX(-18deg)}}

@media (prefers-reduced-motion:reduce){
  .logo-wrap{animation:none}
  .globe-wrap{animation:none;filter:drop-shadow(0 4px 8px rgba(15,44,111,.16))}
  .globe-clip{animation:none}
  .globe-shine-sweep{animation:none;display:none}
}

.slogan-img{max-width:100%;height:auto;display:block;margin:0 auto}
.slogan-img.challenge{width:220px}
.form-label{
  font-size:13px;
  color:#555;
  display:block;
  margin-bottom:5px;
  font-weight:500;
}
.form-input{
  width:100%;
  height:46px;
  border:1px solid #DCE3EE;
  border-radius:8px;
  padding:0 14px;
  font-size:14.5px;
  font-family:inherit;
  margin-bottom:16px;
  transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease;
  color:#1a1a18;
}
.form-input:hover{
  border-color:#AEC0DA;
}
.form-input:focus{
  outline:none;
  border-color:#1a5fa8;
  box-shadow:0 0 0 3px rgba(26,95,168,0.12);
  transform:translateY(-1px);
}
.btn-login{
  width:100%;
  height:46px;
  background:linear-gradient(135deg,#1A5FA8,#164E8F);
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  font-family:inherit;
  transition:background .2s ease, box-shadow .2s ease, transform .1s ease;
  margin-top:8px;
  box-shadow:0 2px 6px rgba(15,44,111,.12);
}
.btn-login:hover{background:linear-gradient(135deg,#164E8F,#123F73);box-shadow:0 3px 8px rgba(15,44,111,.18);}
.btn-login:active{transform:scale(0.98);box-shadow:0 2px 6px rgba(15,44,111,.2);}
.btn-login:focus-visible,.lang-toggle-btn:focus-visible{outline:2px solid #1a5fa8;outline-offset:2px}
.lang-toggle-btn{position:fixed;bottom:20px;right:24px;background:none;border:none;color:#3b5a85;font-size:13px;cursor:pointer;font-family:inherit;padding:6px 10px;border-radius:8px;transition:background-color .15s ease}
.lang-toggle-btn:hover{background:rgba(26,95,168,.08)}
.error-box{
  background:#fff0f0;
  border:1px solid #ffd0d0;
  color:#c0392b;
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  margin-bottom:14px;
  display:none;
  text-align:center;
}
.footer-note{
  text-align:center;
  margin-top:10px;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    <div class="globe-wrap">
      <div class="globe-glow"></div>
      <div class="globe-clip">
        <img class="globe-img" src="/logo-globe.png" alt="EARTH globe">
        <div class="globe-shine-sweep"></div>
      </div>
    </div>
    <img class="earth-text-img" src="/logo-earth-text.png" alt="EARTH">
  </div>
  <div class="error-box" id="err"></div>
  <label class="form-label" data-i18n="lbl.username">ชื่อผู้ใช้งาน</label>
  <input class="form-input" type="text" id="username" data-i18n-placeholder="ph.username" placeholder="กรอก Username" autocomplete="username">
  <label class="form-label" data-i18n="lbl.password">รหัสผ่าน</label>
  <input class="form-input" type="password" id="password" data-i18n-placeholder="ph.password" placeholder="กรอก Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn-login" data-i18n="btn.login" onclick="login()">เข้าสู่ระบบ</button>
  <div class="footer-note"><img class="slogan-img challenge" src="/slogan-challenge.png" alt="CHALLENGE & CHANGE + GRIT"></div>
</div>
<button id="lang-toggle" class="lang-toggle-btn" onclick="toggleLang()">EN</button>
<script>
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!username||!password){err.textContent='กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){err.textContent=data.error;err.style.display='block';return;}
    window.location.href='/';
  }catch(e){err.textContent='เกิดข้อผิดพลาด กรุณาลองใหม่';err.style.display='block';}
}
</script>
<script src="/i18n.js"></script>
</body>
</html>
