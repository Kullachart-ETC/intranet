<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — EARTH (THAILAND)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans Thai', Inter, system-ui, sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(135deg, #0f2c6f 0%, #1a5fa8 40%, #2196c4 70%, #1a8a6e 100%);
  position:relative;
  overflow:hidden;
}
body::before{
  content:'';
  position:absolute;
  width:600px;height:600px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  top:-200px;right:-150px;
}
body::after{
  content:'';
  position:absolute;
  width:400px;height:400px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  bottom:-100px;left:-100px;
}
.circle-mid{
  position:absolute;
  width:300px;height:300px;
  border-radius:50%;
  background:rgba(255,255,255,0.03);
  top:50%;left:10%;
  transform:translateY(-50%);
}
.card{
  position:relative;
  z-index:1;
  background:linear-gradient(165deg, #ffffff 0%, #fafbfe 100%);
  border:1px solid #E4EAF3;
  border-radius:14px;
  padding:32px 40px 28px;
  width:400px;
  max-width:95vw;
  box-shadow:0 6px 20px rgba(20,40,80,0.10);
}
@media (max-width:480px){
  .card{padding:24px 24px 20px}
}

/* โลโก้: fade-in ครั้งเดียวตอนโหลด (~500ms) แล้วนิ่งสนิท ไม่มี loop */
.logo-wrap{text-align:center;margin-bottom:18px;animation:logoFadeIn .5s ease-out both}
.globe-wrap{position:relative;display:inline-block;width:94px;height:94px;margin-bottom:4px;animation:globeShadowFade .5s ease-out .15s both, globeScaleIn .5s ease-out both}
.globe-glow{position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(26,95,168,.20) 0%,rgba(26,95,168,0) 70%);filter:blur(6px);z-index:0}
.globe-clip{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;z-index:1}
.globe-img{width:100%;height:100%;object-fit:contain}
.globe-shine-sweep{position:absolute;top:0;left:0;width:26px;height:100%;background:linear-gradient(75deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%);pointer-events:none;transform:translateX(-60px) skewX(-18deg);animation:globeShineSweep .5s ease-out .45s both}
.earth-text-img{width:69px;height:auto;display:block;margin:0 auto}

@keyframes logoFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes globeScaleIn{from{transform:scale(.95)}to{transform:scale(1)}}
@keyframes globeShadowFade{from{filter:drop-shadow(0 4px 8px rgba(15,44,111,0))}to{filter:drop-shadow(0 4px 8px rgba(15,44,111,.16))}}
@keyframes globeShineSweep{0%{transform:translateX(-60px) skewX(-18deg)}100%{transform:translateX(140px) skewX(-18deg)}}

@media (prefers-reduced-motion:reduce){
  .logo-wrap{animation:none}
  .globe-wrap{animation:none;filter:drop-shadow(0 4px 8px rgba(15,44,111,.16));transform:scale(1)}
  .globe-shine-sweep{animation:none;display:none}
}

.slogan-img{max-width:100%;height:auto;display:block;margin:0 auto}
.slogan-img.challenge{width:220px}
.form-label{
  font-size:13.5px;
  color:#1A5FA8;
  display:block;
  width:94%;
  margin:0 auto 6px;
  font-weight:600;
  letter-spacing:.2px;
}
.input-wrap{position:relative;width:94%;margin:0 auto 16px}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#9AA5B8;font-size:17px;pointer-events:none;z-index:1;transition:color .2s ease}
.input-wrap:focus-within .input-icon{color:#1a5fa8}
.input-eye-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:#9AA5B8;cursor:pointer;padding:8px;display:flex;align-items:center;font-size:17px;border-radius:6px;transition:color .15s ease}
.input-eye-toggle:hover{color:#1a5fa8}
.input-eye-toggle:focus-visible{outline:2px solid #1a5fa8;outline-offset:1px}
.form-input{
  width:100%;
  height:46px;
  border:1px solid #DCE3EE;
  border-radius:8px;
  padding:0 14px 0 42px;
  font-size:14.5px;
  font-family:inherit;
  margin:0;
  display:block;
  transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease;
  color:#1a1a18;
}
.form-input.has-toggle{padding-right:42px}
.form-input:hover{
  border-color:#AEC0DA;
}
.form-input:focus{
  outline:none;
  border-color:#1a5fa8;
  box-shadow:0 0 0 3px rgba(26,95,168,0.12);
  transform:translateY(-1px);
}
.btn-login{
  width:94%;
  height:46px;
  background:linear-gradient(135deg,#1A5FA8,#164E8F);
  color:#fff;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:600;
  letter-spacing:.3px;
  cursor:pointer;
  font-family:inherit;
  transition:background .2s ease, box-shadow .2s ease, transform .1s ease;
  margin:8px auto 0;
  display:block;
  box-shadow:0 2px 6px rgba(15,44,111,.12);
}
.btn-login:hover{background:linear-gradient(135deg,#164E8F,#123F73);box-shadow:0 3px 8px rgba(15,44,111,.18);}
.btn-login:active{transform:scale(0.98);box-shadow:0 2px 6px rgba(15,44,111,.2);}
.btn-login:focus-visible,.lang-toggle-btn:focus-visible{outline:2px solid #1a5fa8;outline-offset:2px}
.lang-toggle-btn{position:absolute;top:14px;right:14px;background:none;border:1px solid #E4EAF3;color:#3b5a85;font-size:11.5px;cursor:pointer;font-family:inherit;padding:3px 9px;border-radius:10px;transition:background-color .15s ease, border-color .15s ease}
.lang-toggle-btn:hover{background:rgba(26,95,168,.08)}
.error-box{
  background:#fff0f0;
  border:1px solid #ffd0d0;
  color:#c0392b;
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  margin-bottom:14px;
  display:none;
  text-align:center;
}
.footer-note{
  text-align:center;
  margin-top:10px;
}
#orbit-group{transform-box:fill-box;transform-origin:50% 50%;animation:orbitSpin 240s linear infinite}
@keyframes orbitSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  #orbit-group{animation:none}
}
</style>
</head>
<body>
<div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0">
  <svg width="100%" height="100%" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="globe">
        <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
        <ellipse cx="60" cy="60" rx="54" ry="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="54" ry="36" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="6" y1="60" x2="114" y2="60" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="18" ry="54" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="36" ry="54" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
      </g>
    </defs>
    <!-- orbital arrangement, not random scatter: two rings centered on the card, echoing the single globe logo it surrounds -->
    <g id="orbit-group">
      <use href="#globe" transform="translate(708.5,531.7) scale(0.55)" opacity="0.65"/>
      <use href="#globe" transform="translate(377.3,697.8) scale(0.62)" opacity="0.6"/>
      <use href="#globe" transform="translate(236.2,385.7) scale(0.48)" opacity="0.55"/>
      <use href="#globe" transform="translate(570.9,238.7) scale(0.58)" opacity="0.6"/>
      <use href="#globe" transform="translate(767.7,716.1) scale(0.9)" opacity="0.4"/>
      <use href="#globe" transform="translate(418.5,873.3) scale(0.75)" opacity="0.35"/>
      <use href="#globe" transform="translate(70.3,644.0) scale(1.1)" opacity="0.45"/>
      <use href="#globe" transform="translate(139.3,190.9) scale(0.65)" opacity="0.4"/>
      <use href="#globe" transform="translate(449,29) scale(0.85)" opacity="0.3"/>
      <use href="#globe" transform="translate(821.7,248) scale(0.7)" opacity="0.4"/>
    </g>
  </svg>
</div>
<div class="circle-mid"></div>
<div class="card">
  <button id="lang-toggle" class="lang-toggle-btn" onclick="toggleLang()">EN</button>
  <div class="logo-wrap">
    <div class="globe-wrap">
      <div class="globe-glow"></div>
      <div class="globe-clip">
        <img class="globe-img" src="/logo-globe.png" alt="EARTH globe">
        <div class="globe-shine-sweep"></div>
      </div>
    </div>
    <img class="earth-text-img" src="/logo-earth-text.png" alt="EARTH">
  </div>
  <div class="error-box" id="err"></div>
  <label class="form-label" data-i18n="lbl.username">ชื่อผู้ใช้งาน</label>
  <div class="input-wrap">
    <i class="ti ti-user input-icon" aria-hidden="true"></i>
    <input class="form-input" type="text" id="username" data-i18n-placeholder="ph.username" placeholder="กรอก Username" autocomplete="username">
  </div>
  <label class="form-label" data-i18n="lbl.password">รหัสผ่าน</label>
  <div class="input-wrap">
    <i class="ti ti-lock input-icon" aria-hidden="true"></i>
    <input class="form-input has-toggle" type="password" id="password" data-i18n-placeholder="ph.password" placeholder="กรอก Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    <button type="button" class="input-eye-toggle" onclick="togglePasswordVisibility()" aria-label="แสดง/ซ่อนรหัสผ่าน"><i class="ti ti-eye" id="eye-icon" aria-hidden="true"></i></button>
  </div>
  <button class="btn-login" data-i18n="btn.login" onclick="login()">เข้าสู่ระบบ</button>
  <div class="footer-note"><img class="slogan-img challenge" src="/slogan-challenge.png" alt="CHALLENGE & CHANGE + GRIT"></div>
</div>
<script>
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!username||!password){err.textContent='กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){err.textContent=data.error;err.style.display='block';return;}
    window.location.href='/';
  }catch(e){err.textContent='เกิดข้อผิดพลาด กรุณาลองใหม่';err.style.display='block';}
}
function togglePasswordVisibility(){
  const pw=document.getElementById('password');
  const icon=document.getElementById('eye-icon');
  const isHidden=pw.type==='password';
  pw.type=isHidden?'text':'password';
  icon.className=isHidden?'ti ti-eye-off':'ti ti-eye';
}
</script>
<script src="/i18n.js"></script>
</body>
</html>
