<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — EARTH (THAILAND)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(135deg, #0f2c6f 0%, #1a5fa8 40%, #2196c4 70%, #1a8a6e 100%);
  position:relative;
  overflow:hidden;
}
/* วงกลมตกแต่ง */
body::before{
  content:'';
  position:absolute;
  width:600px;height:600px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  top:-200px;right:-150px;
}
body::after{
  content:'';
  position:absolute;
  width:400px;height:400px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  bottom:-100px;left:-100px;
}
.circle-mid{
  position:absolute;
  width:300px;height:300px;
  border-radius:50%;
  background:rgba(255,255,255,0.03);
  top:50%;left:10%;
  transform:translateY(-50%);
}
.card{position:relative;z-index:1;
  background:linear-gradient(165deg, #ffffff 0%, #f5f9fd 55%, #eaf2fb 100%);
  border-radius:20px;
  padding:1.25rem 2.25rem 1.5rem;
  width:380px;
  max-width:95vw;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  position:relative;
  z-index:1;
}
.logo-wrap{text-align:center;margin-bottom:.5rem}
.hero-stage{position:relative;width:100%;height:118px;margin-bottom:2px}
.globe-wrap{position:absolute;left:50%;top:4px;width:84px;height:84px;perspective:400px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.2));animation:globeFloat 6s ease-in-out infinite;will-change:transform}
.globe-clip{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden}
.globe-img{width:100%;height:100%;object-fit:contain;animation:globeWobble 7s ease-in-out infinite;will-change:transform}
.globe-shine-sweep{position:absolute;top:0;left:0;width:26px;height:100%;background:linear-gradient(75deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 100%);pointer-events:none;transform:translateX(-60px) skewX(-18deg);animation:globeShineSweep 9s ease-in-out infinite;will-change:transform}
.globe-shadow{width:60%;height:12px;margin:2px auto 0;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.32) 0%,rgba(0,0,0,0) 75%);animation:globeShadowPulse 6s ease-in-out infinite;will-change:transform,opacity}
.earth-text-img{width:130px;height:auto;display:block;margin:0 auto}
@keyframes globeFloat{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
@keyframes globeWobble{0%,100%{transform:rotateY(-16deg) rotateX(2deg)}50%{transform:rotateY(16deg) rotateX(-2deg)}}
@keyframes globeShineSweep{0%{transform:translateX(-60px) skewX(-18deg)}9%{transform:translateX(140px) skewX(-18deg)}100%{transform:translateX(140px) skewX(-18deg)}}
@keyframes globeShadowPulse{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.82);opacity:.55}}
.ars-hero-anim{position:absolute;left:50%;bottom:2px;height:100px;margin-left:-17px;transform-origin:50% 100%;animation:heroCycle 10s ease-in-out infinite;z-index:2}
.ars-hero-img{height:100%;width:auto;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.ars-spark{position:absolute;top:6%;right:-10px;color:#ffd23f;font-size:15px;text-shadow:0 0 4px rgba(255,180,0,.8);animation:sparkleBurst 10s ease-in-out infinite}
.ars-mosquito{position:absolute;top:16%;right:-4px;font-size:15px;animation:mosquitoFlee 10s ease-in-out infinite}
@keyframes heroCycle{
  0%{transform:translateX(0) scale(.2);opacity:0}
  4%{opacity:1}
  15%{transform:translateX(54px) scale(1);opacity:1}
  25%{transform:translateX(54px) scale(1);opacity:1}
  35%{transform:translateX(54px) scale(1.04);opacity:1}
  44%{transform:translateX(0) scale(.2);opacity:0}
  100%{transform:translateX(0) scale(.2);opacity:0}
}
@keyframes sparkleBurst{
  0%,13%,27%,100%{opacity:0;transform:scale(.5)}
  16%,24%{opacity:1;transform:scale(1.15)}
}
@keyframes mosquitoFlee{
  0%,25%{opacity:0;transform:translate(0,0) scale(.8)}
  27%{opacity:1}
  35%{opacity:1;transform:translate(85px,-22px) scale(.5)}
  37%,100%{opacity:0;transform:translate(95px,-26px) scale(.4)}
}
@media (prefers-reduced-motion:reduce){
  .globe-wrap{animation:none;transform:translateX(-50%)}
  .globe-img{animation:none}
  .globe-shine-sweep{animation:none;display:none}
  .globe-shadow{animation:none}
  .ars-hero-anim{animation:none;transform:translateX(50px) scale(1);opacity:1}
  .ars-spark,.ars-mosquito{animation:none;opacity:0}
}
.slogan-img{max-width:100%;height:auto;display:block;margin:0 auto}
.slogan-img.challenge{width:220px}
.divider{
  border:none;
  border-top:1px solid #eee;
  margin-bottom:1rem;
}
.form-label{
  font-size:13px;
  color:#555;
  display:block;
  margin-bottom:5px;
  font-weight:500;
}
.form-input{
  width:100%;
  border:1.5px solid #e0e0e0;
  border-radius:10px;
  padding:11px 14px;
  font-size:15px;
  font-family:'Sarabun',sans-serif;
  margin-bottom:16px;
  transition:border-color .2s ease, box-shadow .2s ease, transform .15s ease;
  color:#1a1a18;
}
.form-input:hover{
  border-color:#b9c8dd;
}
.form-input:focus{
  outline:none;
  border-color:#1a5fa8;
  box-shadow:0 0 0 3px rgba(26,95,168,0.12);
  transform:translateY(-1px);
}
.btn-login{
  width:100%;
  background:linear-gradient(135deg,#1a5fa8,#0f2c6f);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  font-family:'Sarabun',sans-serif;
  transition:opacity .2s ease, transform .2s ease, box-shadow .2s ease;
  margin-top:4px;
  box-shadow:0 2px 8px rgba(15,44,111,.15);
}
.btn-login:hover{opacity:0.97;transform:translateY(-2px);box-shadow:0 10px 22px rgba(15,44,111,.35);}
.btn-login:active{transform:translateY(0) scale(0.98);box-shadow:0 2px 6px rgba(15,44,111,.2);}
.lang-toggle-btn{position:absolute;top:14px;right:14px;background:#F0F2F7;color:#0f2c6f;border:1px solid #dde1ea;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.lang-toggle-btn:hover{background:#e2e6ee}
.error-box{
  background:#fff0f0;
  border:1px solid #ffd0d0;
  color:#c0392b;
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  margin-bottom:14px;
  display:none;
  text-align:center;
}
.footer-note{
  text-align:center;
  margin-top:1rem;
}
</style>
</head>
<body>
<div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0">
  <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="globe">
        <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
        <ellipse cx="60" cy="60" rx="54" ry="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="54" ry="36" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="6" y1="60" x2="114" y2="60" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="18" ry="54" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="36" ry="54" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
      </g>
    </defs>
    <use href="#globe" transform="translate(20,30) scale(1.6)" opacity="0.9"/>
    <use href="#globe" transform="translate(580,60) scale(2)" opacity="0.8"/>
    <use href="#globe" transform="translate(-20,350) scale(2.4)" opacity="0.7"/>
    <use href="#globe" transform="translate(700,280) scale(1.4)" opacity="0.9"/>
    <use href="#globe" transform="translate(300,10) scale(1.2)" opacity="0.6"/>
    <use href="#globe" transform="translate(130,500) scale(1.8)" opacity="0.7"/>
    <use href="#globe" transform="translate(480,420) scale(1.5)" opacity="0.8"/>
    <use href="#globe" transform="translate(750,500) scale(2.2)" opacity="0.6"/>
    <use href="#globe" transform="translate(350,300) scale(0.8)" opacity="0.5"/>
    <use href="#globe" transform="translate(600,180) scale(1.0)" opacity="0.6"/>
  </svg>
</div>
<div class="circle-mid"></div>
<div class="card">
  <div class="logo-wrap">
    <div class="hero-stage">
      <div class="globe-wrap">
        <div class="globe-clip">
          <img class="globe-img" src="/logo-globe.png" alt="EARTH globe">
          <div class="globe-shine-sweep"></div>
        </div>
      </div>
      <div class="ars-hero-anim">
        <div class="ars-spark">✦</div>
        <div class="ars-mosquito">🦟</div>
        <img class="ars-hero-img" src="/ars-hero-solo.png" alt="ARS Hero">
      </div>
    </div>
    <div class="globe-shadow"></div>
    <img class="earth-text-img" src="/logo-earth-text.png" alt="EARTH">
  </div>
  <hr class="divider">
  <button id="lang-toggle" class="lang-toggle-btn" onclick="toggleLang()">EN</button>
  <div class="error-box" id="err"></div>
  <label class="form-label" data-i18n="lbl.username">ชื่อผู้ใช้งาน</label>
  <input class="form-input" type="text" id="username" data-i18n-placeholder="ph.username" placeholder="กรอก Username" autocomplete="username">
  <label class="form-label" data-i18n="lbl.password">รหัสผ่าน</label>
  <input class="form-input" type="password" id="password" data-i18n-placeholder="ph.password" placeholder="กรอก Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn-login" data-i18n="btn.login" onclick="login()">เข้าสู่ระบบ</button>
  <div class="footer-note"><img class="slogan-img challenge" src="/slogan-challenge.png" alt="CHALLENGE & CHANGE + GRIT"></div>
</div>
<script>
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!username||!password){err.textContent='กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){err.textContent=data.error;err.style.display='block';return;}
    window.location.href='/';
  }catch(e){err.textContent='เกิดข้อผิดพลาด กรุณาลองใหม่';err.style.display='block';}
}
</script>
<script src="/i18n.js"></script>
</body>
</html>
