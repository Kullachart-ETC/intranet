<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบ — EARTH (THAILAND)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sarabun',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background: linear-gradient(135deg, #0f2c6f 0%, #1a5fa8 40%, #2196c4 70%, #1a8a6e 100%);
  position:relative;
  overflow:hidden;
}
/* วงกลมตกแต่ง */
body::before{
  content:'';
  position:absolute;
  width:600px;height:600px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  top:-200px;right:-150px;
}
body::after{
  content:'';
  position:absolute;
  width:400px;height:400px;
  border-radius:50%;
  background:rgba(255,255,255,0.04);
  bottom:-100px;left:-100px;
}
.circle-mid{
  position:absolute;
  width:300px;height:300px;
  border-radius:50%;
  background:rgba(255,255,255,0.03);
  top:50%;left:10%;
  transform:translateY(-50%);
}
.card{position:relative;z-index:1;
  background:rgba(255,255,255,0.97);
  border-radius:20px;
  padding:1.25rem 2.25rem 1.5rem;
  width:380px;
  max-width:95vw;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
  position:relative;
  z-index:1;
}
.logo-wrap{text-align:center;margin-bottom:.5rem}
.globe-wrap{position:relative;display:inline-block;width:84px;height:84px;margin-bottom:6px;perspective:400px;border-radius:50%;overflow:hidden}
.globe-cyl{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:globeSpin 9s linear infinite;will-change:transform}
.globe-strip{position:absolute;top:0;left:50%;height:100%;background-image:url('/logo-globe.png');background-repeat:no-repeat}
.globe-shine{position:absolute;top:6%;left:12%;width:46%;height:34%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.95) 0%,rgba(255,255,255,.55) 30%,rgba(255,255,255,0) 70%);pointer-events:none;z-index:5;filter:blur(1px)}
.globe-shadow{width:60%;height:12px;margin:2px auto 0;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.32) 0%,rgba(0,0,0,0) 75%)}
.earth-text-img{width:130px;height:auto;display:block;margin:0 auto}
@keyframes globeSpin{from{transform:rotateY(0deg)}to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.globe-cyl{animation:none}}
.hero-wrap{text-align:center;margin-bottom:.4rem}
.hero-fx{position:relative;display:inline-block;transition:transform .25s ease-in-out}
.hero-fx:hover{transform:scale(1.03)}
.hero-sway{animation:heroSway 6s ease-in-out infinite;will-change:transform}
.hero-float{animation:heroFloat 4s ease-in-out infinite;will-change:transform}
.hero-breathe{position:relative;animation:heroBreathe 3s ease-in-out infinite;will-change:transform}
.hero-img{width:100%;max-width:219px;height:auto;display:block;margin:0 auto;position:relative;z-index:2}
.hero-glow{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(255,205,60,.55) 0%,rgba(255,205,60,0) 70%);filter:blur(6px);animation:heroGlow 3s ease-in-out infinite;will-change:opacity;z-index:1}
.hero-smoke{position:absolute;bottom:6%;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(3px);opacity:0;will-change:transform,opacity}
.hero-smoke.s1{left:20%;animation:heroSmoke 5s ease-in infinite}
.hero-smoke.s2{right:22%;animation:heroSmoke 6s ease-in infinite 2s}
.hero-sparkle{position:absolute;color:#ffd23f;font-size:14px;opacity:0;will-change:transform,opacity}
.hero-sparkle.sp1{top:6%;left:2%;animation:heroSparkle 3.4s ease-in-out infinite .2s}
.hero-sparkle.sp2{top:14%;right:0;animation:heroSparkle 2.8s ease-in-out infinite 1.4s}
.hero-sparkle.sp3{bottom:20%;left:-2%;animation:heroSparkle 3.9s ease-in-out infinite 2.4s}
.hero-lightning{position:absolute;top:2%;right:12%;width:36px;height:36px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,0) 72%);opacity:0;animation:heroLightning 8s ease-in-out infinite;z-index:3}
.hero-mosquito{position:absolute;top:38%;left:0;font-size:14px;opacity:0;animation:heroMosquito 12s linear infinite;z-index:3}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes heroSway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@keyframes heroBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
@keyframes heroGlow{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes heroSmoke{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:.5}80%{opacity:0}100%{transform:translateY(-46px) scale(1.8);opacity:0}}
@keyframes heroSparkle{0%,100%{transform:scale(.6);opacity:0}50%{transform:scale(1.15);opacity:1}}
@keyframes heroLightning{0%,93%,100%{opacity:0;transform:scale(.8)}95%{opacity:.9;transform:scale(1.15)}97%{opacity:0;transform:scale(.9)}}
@keyframes heroMosquito{0%,68%{opacity:0;transform:translateX(-10px)}70%{opacity:1}88%{opacity:1;transform:translateX(230px)}90%,100%{opacity:0;transform:translateX(240px)}}
@media (prefers-reduced-motion:reduce){
  .hero-sway,.hero-float,.hero-breathe,.hero-glow,.hero-smoke,.hero-sparkle,.hero-lightning,.hero-mosquito{animation:none}
}
.slogan-img{max-width:100%;height:auto;display:block;margin:0 auto}
.slogan-img.challenge{width:220px}
.divider{
  border:none;
  border-top:1px solid #eee;
  margin-bottom:1rem;
}
.form-label{
  font-size:13px;
  color:#555;
  display:block;
  margin-bottom:5px;
  font-weight:500;
}
.form-input{
  width:100%;
  border:1.5px solid #e0e0e0;
  border-radius:10px;
  padding:11px 14px;
  font-size:15px;
  font-family:'Sarabun',sans-serif;
  margin-bottom:16px;
  transition:border-color .2s;
  color:#1a1a18;
}
.form-input:focus{
  outline:none;
  border-color:#1a5fa8;
  box-shadow:0 0 0 3px rgba(26,95,168,0.1);
}
.btn-login{
  width:100%;
  background:linear-gradient(135deg,#1a5fa8,#0f2c6f);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  font-family:'Sarabun',sans-serif;
  transition:opacity .2s, transform .1s;
  margin-top:4px;
}
.btn-login:hover{opacity:0.9;}
.btn-login:active{transform:scale(0.98);}
.lang-toggle-btn{position:absolute;top:14px;right:14px;background:#F0F2F7;color:#0f2c6f;border:1px solid #dde1ea;border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.lang-toggle-btn:hover{background:#e2e6ee}
.error-box{
  background:#fff0f0;
  border:1px solid #ffd0d0;
  color:#c0392b;
  border-radius:8px;
  padding:10px 14px;
  font-size:13px;
  margin-bottom:14px;
  display:none;
  text-align:center;
}
.footer-note{
  text-align:center;
  margin-top:1rem;
}
</style>
</head>
<body>
<div style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0">
  <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="globe">
        <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
        <ellipse cx="60" cy="60" rx="54" ry="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="54" ry="36" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="6" y1="60" x2="114" y2="60" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="18" ry="54" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
        <ellipse cx="60" cy="60" rx="36" ry="54" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
        <line x1="60" y1="6" x2="60" y2="114" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
      </g>
    </defs>
    <use href="#globe" transform="translate(20,30) scale(1.6)" opacity="0.9"/>
    <use href="#globe" transform="translate(580,60) scale(2)" opacity="0.8"/>
    <use href="#globe" transform="translate(-20,350) scale(2.4)" opacity="0.7"/>
    <use href="#globe" transform="translate(700,280) scale(1.4)" opacity="0.9"/>
    <use href="#globe" transform="translate(300,10) scale(1.2)" opacity="0.6"/>
    <use href="#globe" transform="translate(130,500) scale(1.8)" opacity="0.7"/>
    <use href="#globe" transform="translate(480,420) scale(1.5)" opacity="0.8"/>
    <use href="#globe" transform="translate(750,500) scale(2.2)" opacity="0.6"/>
    <use href="#globe" transform="translate(350,300) scale(0.8)" opacity="0.5"/>
    <use href="#globe" transform="translate(600,180) scale(1.0)" opacity="0.6"/>
  </svg>
</div>
<div class="circle-mid"></div>
<div class="card">
  <div class="logo-wrap">
    <div class="globe-wrap">
      <div class="globe-cyl" id="globeCyl"></div>
      <div class="globe-shine"></div>
    </div>
    <div class="globe-shadow"></div>
    <img class="earth-text-img" src="/logo-earth-text.png" alt="EARTH">
  </div>
  <div class="hero-wrap">
    <div class="hero-fx">
      <div class="hero-smoke s1"></div>
      <div class="hero-smoke s2"></div>
      <div class="hero-sparkle sp1">✦</div>
      <div class="hero-sparkle sp2">✦</div>
      <div class="hero-sparkle sp3">✦</div>
      <div class="hero-lightning"></div>
      <div class="hero-mosquito">🦟</div>
      <div class="hero-sway">
        <div class="hero-float">
          <div class="hero-breathe">
            <div class="hero-glow"></div>
            <img class="hero-img" src="/login-hero.png" alt="ARS">
          </div>
        </div>
      </div>
    </div>
  </div>
  <hr class="divider">
  <button id="lang-toggle" class="lang-toggle-btn" onclick="toggleLang()">EN</button>
  <div class="error-box" id="err"></div>
  <label class="form-label" data-i18n="lbl.username">ชื่อผู้ใช้งาน</label>
  <input class="form-input" type="text" id="username" data-i18n-placeholder="ph.username" placeholder="กรอก Username" autocomplete="username">
  <label class="form-label" data-i18n="lbl.password">รหัสผ่าน</label>
  <input class="form-input" type="password" id="password" data-i18n-placeholder="ph.password" placeholder="กรอก Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
  <button class="btn-login" data-i18n="btn.login" onclick="login()">เข้าสู่ระบบ</button>
  <div class="footer-note"><img class="slogan-img challenge" src="/slogan-challenge.png" alt="CHALLENGE & CHANGE + GRIT"></div>
</div>
<script>
async function login(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err');
  err.style.display='none';
  if(!username||!password){err.textContent='กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';err.style.display='block';return;}
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){err.textContent=data.error;err.style.display='block';return;}
    window.location.href='/';
  }catch(e){err.textContent='เกิดข้อผิดพลาด กรุณาลองใหม่';err.style.display='block';}
}
(function(){
  const cyl = document.getElementById('globeCyl');
  if(!cyl) return;
  const N = 24, R = 42;
  const stripAngle = 360 / N;
  const stripW = (2 * Math.PI * R) / N;
  const texW = 2 * Math.PI * R;
  for (let i = 0; i < N; i++) {
    const strip = document.createElement('div');
    strip.className = 'globe-strip';
    const angle = i * stripAngle;
    strip.style.width = stripW + 'px';
    strip.style.marginLeft = (-stripW / 2) + 'px';
    strip.style.backgroundSize = texW + 'px 84px';
    strip.style.backgroundPosition = (-(i * stripW)) + 'px 0';
    strip.style.transform = `rotateY(${angle}deg) translateZ(${R}px)`;
    const rad = angle * Math.PI / 180;
    const shade = Math.max(0.3, Math.cos(rad) * 0.55 + 0.55);
    strip.style.filter = `brightness(${shade})`;
    cyl.appendChild(strip);
  }
})();
</script>
<script src="/i18n.js"></script>
</body>
</html>
