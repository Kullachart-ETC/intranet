<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>โครงสร้างองค์กร - EARTH (THAILAND)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Sarabun',sans-serif;background:#F5F5F3;color:#1a1a18}
.nav{background:#1a1a18;padding:0 24px;display:flex;align-items:center;gap:16px;height:52px;position:sticky;top:0;z-index:50}
.nav-logo{color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;text-decoration:none}
.nav-logo img{height:32px;width:32px;object-fit:contain}
.nav-links{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.nav-links a{color:#aaa;font-size:13px;padding:6px 10px;border-radius:6px;text-decoration:none;transition:.15s}
.nav-links a:hover,.nav-links a.active{color:#fff;background:rgba(255,255,255,.1)}
a.nav-home{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#fff;color:#1D9E75;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.15s}
a.nav-home:hover{background:#1D9E75;color:#fff;transform:scale(1.08)}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-user{color:#ccc;font-size:12px}
.btn-logout{font-size:12px;color:#aaa;background:none;border:1px solid #444;border-radius:6px;padding:4px 10px;cursor:pointer;font-family:inherit}
.page{max-width:1100px;margin:0 auto;padding:32px 16px}
h1{font-size:22px;font-weight:700;margin-bottom:20px}

/* TOP TABS */
.top-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.top-tab{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:13.5px;font-weight:600;color:#444;text-decoration:none;cursor:pointer;font-family:inherit;transition:.15s}
.top-tab:hover{border-color:#1D9E75;color:#1D9E75}
.top-tab.active{background:#1D9E75;border-color:#1D9E75;color:#fff}

/* BREADCRUMB */
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:#888;margin-bottom:18px}
.crumb button{background:none;border:none;color:#1D9E75;font-family:inherit;font-size:13px;cursor:pointer;padding:2px 4px;font-weight:600}
.crumb button:hover{text-decoration:underline}
.crumb span.sep{color:#ccc}
.crumb span.here{color:#1a1a18;font-weight:600}

/* SITE / DEPT CARDS */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pick-card{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.pick-card:hover{border-color:var(--accent,#1D9E75);transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.pick-card .pick-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 12px}
.pick-card .pick-name{font-size:14px;font-weight:600}
.pick-card .pick-count{font-size:12px;color:#888;margin-top:4px}
.empty{text-align:center;color:#aaa;padding:48px;font-size:14px}

/* ORG TREE — laid out in rows by position rank (Sr. Manager row, Manager row, ...
   down to Staff row); connector lines follow the actual "รหัสหัวหน้า" (manager_id)
   relationship even when it skips rank rows, drawn with SVG after layout. */
.tree-wrap{overflow-x:auto;padding:10px 0 40px}
.tree-canvas{position:relative;display:inline-block;min-width:100%;padding:20px 40px;box-sizing:border-box}
#tree-svg{position:absolute;top:0;left:0;pointer-events:none}
.org-row{display:flex;justify-content:center;gap:28px;position:relative;z-index:1;margin-bottom:64px}
.org-row:last-child{margin-bottom:0}

.org-node{background:#fff;border:1px solid #e5e5e0;border-radius:12px;padding:14px 16px;min-width:170px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.org-node .avatar{width:44px;height:44px;border-radius:50%;background:#E8F5F0;color:#1D9E75;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 8px}
.org-node .n-name{font-size:13.5px;font-weight:700;text-align:center}
.org-node .n-pos{font-size:12px;color:#1D9E75;text-align:center;margin-top:2px}
.org-node .n-meta{font-size:11px;color:#888;text-align:center;margin-top:6px;line-height:1.6}
</style>
</head>
<body>
<nav class="nav">
  <a href="/index.html" class="nav-logo"><img src="/logo.png" onerror="this.style.display='none'"> EARTH (THAILAND)</a>
  <div class="nav-links">
    <a href="/index.html" class="nav-home" title="หน้าหลัก"><i class="ti ti-home"></i></a>
    <a href="/about.html">เกี่ยวกับเรา</a>
    <a href="/org-chart.html" class="active">โครงสร้างองค์กร</a>
    <a href="/news.html">ข่าวสารกิจกรรม</a>
    <a href="/webboard.html">เว็บบอร์ด</a>
    <a href="/regulations.html">ระเบียบบริษัท</a>
    <a href="/media-center.html">Media Center</a>
    <a href="/forms.html">แบบฟอร์ม - ARS</a>
  </div>
  <div class="nav-right"><span class="nav-user" id="nav-user"></span><button class="btn-logout" onclick="logout()">ออกจากระบบ</button></div>
</nav>
<div class="page">
  <h1>🏗 โครงสร้างองค์กร</h1>

  <div class="top-tabs">
    <a class="top-tab" href="/org-docs/board.pdf" target="_blank"><i class="ti ti-users"></i> คณะกรรมการบริษัท</a>
    <a class="top-tab" href="/org-docs/management.pdf" target="_blank"><i class="ti ti-briefcase"></i> ทีมผู้บริหาร</a>
    <button class="top-tab active" id="tab-structure" onclick="goSites()"><i class="ti ti-sitemap"></i> โครงสร้างบริษัท</button>
  </div>

  <div class="crumb" id="crumb"></div>
  <div id="content"><div class="empty">กำลังโหลด...</div></div>
</div>
<script>
async function logout(){await fetch('/api/logout',{method:'POST'});window.location.href='/login.html';}

const SITES = [
  { key:'head_office', label:'Head Office', icon:'ti-building-skyscraper',  color:'#0f2c6f' },
  { key:'branch',      label:'Branch',      icon:'ti-building-store',      color:'#0f766e' },
  { key:'factory1',    label:'Factory1',    icon:'ti-building-factory-2',  color:'#B8860B' },
  { key:'factory2',    label:'Factory2',    icon:'ti-building-factory-2',  color:'#993C1D' }
];
const SITE_LABEL = Object.fromEntries(SITES.map(s=>[s.key,s.label]));

// ไอคอน+สีของการ์ดแผนก จับคู่จากคำในชื่อแผนก (เรียงลำดับ ตัวแรกที่แมตช์ชนะ) ไม่ตรงเลยใช้ค่า default
const DEPT_ICON_RULES = [
  [/\bac\b|acc|บัญชี|finance|การเงิน/i,      { icon:'ti-calculator',      color:'#993C1D' }],
  [/purchas|จัดซื้อ/i,                       { icon:'ti-shopping-cart',   color:'#B8860B' }],
  [/supply chain|logistic|โลจิสติกส์/i,      { icon:'ti-truck',           color:'#0f6e56' }],
  [/\bqa\b|quality|คุณภาพ/i,                 { icon:'ti-shield-check',    color:'#0f766e' }],
  [/maintenance|ซ่อมบำรุง/i,                 { icon:'ti-tools',           color:'#6b7280' }],
  [/production|line|โรงงาน|ผลิต/i,           { icon:'ti-settings',        color:'#4b5563' }],
  [/\bit\b|information technology|เทคโนโลยี/i,{ icon:'ti-device-desktop', color:'#1D9E75' }],
  [/hr\s*&?\s*ga|human resource|บุคคล|general affair/i,{ icon:'ti-users-group', color:'#185FA5' }],
  [/trade marketing|marketing|การตลาด/i,     { icon:'ti-speakerphone',    color:'#993556' }],
  [/foreign trade|ต่างประเทศ/i,              { icon:'ti-world',           color:'#2563eb' }],
  [/overseas sales|\bsales?\b|ขาย/i,         { icon:'ti-chart-line',      color:'#534AB7' }],
  [/director|management|ผู้บริหาร/i,         { icon:'ti-user-star',       color:'#0f2c6f' }]
];
function deptIconFor(deptName){
  const found = DEPT_ICON_RULES.find(([re])=>re.test(deptName));
  return found ? found[1] : { icon:'ti-folder', color:'#1D9E75' };
}

// ลำดับชั้นตำแหน่ง กำหนด "แถว" ที่แต่ละคนจะถูกวางในผังองค์กร (มาก่อน = แถวบนกว่า)
// เส้นเชื่อมระหว่างแถวยังคงยึด "รหัสหัวหน้า" (manager_id) จริงเสมอ — มีผลกับการอนุมัติใบลาด้วย
const POSITION_RANK = [
  'sr. manager', 'manager', 'vice manager', 'asst. manager',
  'senior supervisor', 'supervisor', 'chief', 'staff'
];
function rankOf(u){
  // เลขระดับ (org_level, 1-8) เป็นตัวหลัก แม่นยำกว่าเพราะไม่ขึ้นกับการสะกดชื่อตำแหน่ง
  const lvl = parseInt(u.org_level);
  if (lvl >= 1 && lvl <= 8) return lvl - 1;
  // ถ้าไม่มีเลขระดับ (ข้อมูลเก่า) ค่อย fallback ไปเทียบชื่อตำแหน่งแบบเดิม
  const i = POSITION_RANK.indexOf(String(u.position||'').trim().toLowerCase());
  return i === -1 ? POSITION_RANK.length : i;
}

let orgData = [];
let currentDepts = [];
let state = { site:null, dept:null };

function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderCrumb(){
  const parts = [`<button onclick="goSites()">โครงสร้างบริษัท</button>`];
  if(state.site){
    parts.push('<span class="sep">›</span>');
    parts.push(state.dept
      ? `<button onclick="goDepts('${state.site}')">${esc(SITE_LABEL[state.site])}</button>`
      : `<span class="here">${esc(SITE_LABEL[state.site])}</span>`);
  }
  if(state.dept){
    parts.push('<span class="sep">›</span>');
    parts.push(`<span class="here">${esc(state.dept)}</span>`);
  }
  document.getElementById('crumb').innerHTML = parts.join('');
}

function goSites(){
  state.site = null; state.dept = null;
  renderCrumb();
  const html = SITES.map(s=>{
    const count = orgData.filter(u=>u.org_site===s.key).length;
    return `<div class="pick-card" style="--accent:${s.color}" onclick="goDepts('${s.key}')">
      <div class="pick-icon" style="background:${s.color}22;color:${s.color}"><i class="ti ${s.icon}"></i></div>
      <div class="pick-name">${esc(s.label)}</div>
      <div class="pick-count">${count} คน</div>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = `<div class="pick-grid">${html}</div>`;
}

function goDepts(siteKey){
  state.site = siteKey; state.dept = null;
  renderCrumb();
  const members = orgData.filter(u=>u.org_site===siteKey);
  if(!members.length){
    document.getElementById('content').innerHTML = '<div class="empty">ยังไม่มีข้อมูลพนักงานสำหรับ Site นี้</div>';
    return;
  }
  const depts = [...new Set(members.map(u=>u.dept))].sort();
  currentDepts = depts;
  const html = depts.map((d,i)=>{
    const count = members.filter(u=>u.dept===d).length;
    const { icon, color } = deptIconFor(d);
    return `<div class="pick-card" style="--accent:${color}" onclick="goTree('${siteKey}', ${i})">
      <div class="pick-icon" style="background:${color}22;color:${color}"><i class="ti ${icon}"></i></div>
      <div class="pick-name">${esc(d)}</div>
      <div class="pick-count">${count} คน</div>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = `<div class="pick-grid">${html}</div>`;
}

function nodeHTML(u){
  const meta = [u.tel_ext?`☎ ${esc(u.tel_ext)}`:'', u.email?esc(u.email):''].filter(Boolean).join(' · ');
  return `<div class="org-node-wrap" data-id="${u.id}"><div class="org-node">
    <div class="avatar"><i class="ti ti-user"></i></div>
    <div class="n-name">${esc(u.name)}</div>
    ${u.position?`<div class="n-pos">${esc(u.position)}</div>`:''}
    ${meta?`<div class="n-meta">${meta}</div>`:''}
  </div></div>`;
}

// วางเป็นแถวตามลำดับตำแหน่ง (rank เดียวกัน = แถวเดียวกัน) แล้วลากเส้นเชื่อมตาม
// "รหัสหัวหน้า" จริง ถึงจะข้ามหลายระดับตำแหน่งก็เชื่อมได้ถูกต้อง
function goTree(siteKey, deptIdx){
  const dept = currentDepts[deptIdx];
  state.site = siteKey; state.dept = dept;
  renderCrumb();
  const members = orgData.filter(u=>u.org_site===siteKey && u.dept===dept);
  if(!members.length){
    document.getElementById('content').innerHTML = '<div class="empty">ยังไม่มีข้อมูลพนักงานในแผนกนี้</div>';
    return;
  }

  const byRankMap = new Map();
  members.forEach(u=>{
    const r = rankOf(u);
    if(!byRankMap.has(r)) byRankMap.set(r, []);
    byRankMap.get(r).push(u);
  });
  const ranks = [...byRankMap.keys()].sort((a,b)=>a-b);

  const rowsHTML = ranks.map(r=>{
    const rowMembers = [...byRankMap.get(r)].sort((a,b)=>a.name.localeCompare(b.name,'th'));
    return `<div class="org-row">${rowMembers.map(nodeHTML).join('')}</div>`;
  }).join('');

  document.getElementById('content').innerHTML =
    `<div class="tree-wrap"><div class="tree-canvas" id="tree-canvas"><svg id="tree-svg"></svg>${rowsHTML}</div></div>`;

  drawConnectors(members);
}

// เส้นเชื่อมในผังนี้แสดง "ลำดับชั้นตำแหน่ง" (แถวล่างต่อจากแถวบนถัดไปเสมอ ห้ามข้ามระดับ)
// ซึ่งอาจไม่ใช่คนเดียวกับ "รหัสหัวหน้า" ที่ใช้อนุมัติใบลา (เพราะบางบริษัทให้อนุมัติข้ามระดับได้)
// "รหัสหัวหน้า" ถูกใช้แค่ช่วยตัดสินใจตอนแถวบนถัดไปมีมากกว่า 1 คน ว่าควรต่อกับใคร
function visualParentOf(members){
  const byId = new Map(members.map(u=>[u.id, u]));
  function managerChain(u){
    const chain = []; const seen = new Set([u.id]); let cur = u;
    while(cur.manager_id && byId.has(cur.manager_id) && !seen.has(cur.manager_id)){
      cur = byId.get(cur.manager_id);
      chain.push(cur);
      seen.add(cur.id);
    }
    return chain;
  }

  const parentOf = new Map();
  members.forEach(u=>{
    const myRank = rankOf(u);
    const seniorRanks = members.filter(x=>x.id!==u.id && rankOf(x)<myRank).map(x=>rankOf(x));
    if(!seniorRanks.length){ parentOf.set(u.id, null); return; }
    const nearestRank = Math.max(...seniorRanks);
    const candidates = members.filter(x=>x.id!==u.id && rankOf(x)===nearestRank);
    if(candidates.length === 1){ parentOf.set(u.id, candidates[0].id); return; }
    const viaChain = managerChain(u).find(a=>candidates.some(c=>c.id===a.id));
    parentOf.set(u.id, viaChain ? viaChain.id : candidates[0].id);
  });
  return parentOf;
}

function drawConnectors(members){
  const canvas = document.getElementById('tree-canvas');
  const svg = document.getElementById('tree-svg');
  const canvasRect = canvas.getBoundingClientRect();
  const w = canvas.scrollWidth, h = canvas.scrollHeight;
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';

  const parentOf = visualParentOf(members);
  let paths = '';
  members.forEach(u=>{
    const parentId = parentOf.get(u.id);
    if(!parentId) return;
    const childEl  = canvas.querySelector(`[data-id="${u.id}"]`);
    const parentEl = canvas.querySelector(`[data-id="${parentId}"]`);
    if(!childEl || !parentEl) return;
    const c = childEl.getBoundingClientRect();
    const p = parentEl.getBoundingClientRect();
    const x1 = p.left - canvasRect.left + p.width/2, y1 = p.bottom - canvasRect.top;
    const x2 = c.left - canvasRect.left + c.width/2, y2 = c.top - canvasRect.top;
    const midY = (y1 + y2) / 2;
    paths += `<path d="M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}" fill="none" stroke="#c7cdc5" stroke-width="2"/>`;
  });
  svg.innerHTML = paths;
}

(async()=>{
  try{
    const me = await fetch('/api/me').then(r=>r.json());
    if(me.error){ window.location.href='/login.html'; return; }
    document.getElementById('nav-user').textContent = me.name;

    orgData = await fetch('/api/org-chart').then(r=>r.ok?r.json():[]).catch(()=>[]);
    goSites();
  }catch(e){ window.location.href='/login.html'; }
})();
</script>
</body></html>
